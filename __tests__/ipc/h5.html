<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>H5</title>
</head>
<body>
<h1>H5</h1>
<div style="margin-bottom: 20px">
  <button onclick="openDialog()">打开子应用对话框</button>
</div>
<iframe id="iframeId" src="./iframe.html"
        style="border:1px solid #f1f1f1;width: 100%;height: 500px;background: rgba(0,0,0,.1);border-radius: 10px"></iframe>
<script type="module">
  import {H5Bridge} from "../../dist/index.js";

  const iframe = document.getElementById("iframeId");
  const h5Bridge = new H5Bridge(iframe);
  window.openDialog = () => {
    // 调用子应用方法
    h5Bridge.call('openDialog',"hello world");
  }

  // 监听子应用发布的事件
  h5Bridge.on("getUserInfo", (data) => {
    // 查询用户信息
    console.log(data, "userId");
    h5Bridge.emit("getUserInfo", {id: 5, name: "张三", age: 23, sex: "男"})
  })

</script>
</body>
</html>
